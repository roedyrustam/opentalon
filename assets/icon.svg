<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Space Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#162038" stop-opacity="1"/>
      <stop offset="65%" stop-color="#0b101e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="1"/>
    </radialGradient>

    <!-- OpenClaw Fast Path Cyan Gradient -->
    <linearGradient id="fastPathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>

    <!-- Hermes Slow Path Violet-Gold Evolution Gradient -->
    <linearGradient id="slowPathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Hermes Cybernetic Golden-Violet Wing Gradient -->
    <linearGradient id="hermesWingLeft" x1="100%" y1="50%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="hermesWingRight" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </linearGradient>

    <!-- OpenClaw Metallic Titanium Armor -->
    <linearGradient id="metalDark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="metalFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Zero-Trust Emerald Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Crisp Glow Filter -->
    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes orbitCw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitCcw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes corePulse {
        0%, 100% { transform: scale(0.97); }
        50% { transform: scale(1.04); }
      }
      @keyframes wingHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .anim-orbit-cw { transform-origin: 256px 264px; animation: orbitCw 18s linear infinite; }
      .anim-orbit-ccw { transform-origin: 256px 264px; animation: orbitCcw 22s linear infinite; }
      .anim-core { transform-origin: 256px 264px; animation: corePulse 3.5s ease-in-out infinite; }
      .anim-wings { transform-origin: 256px 264px; animation: wingHover 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5"/>

  <!-- Outer Zero-Trust Hexagonal Sandbox Matrix (OpenClaw Security Cage) -->
  <polygon points="256,36 446,146 446,366 256,476 66,366 66,146"
           fill="none" stroke="url(#shieldGrad)" stroke-width="2" stroke-dasharray="10 6" opacity="0.65"/>
  <polygon points="256,54 430,155 430,357 256,458 82,357 82,155"
           fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.8"/>

  <!-- HERMES IDENTITY: Cybernetic Talaria Wings (Speed, Autonomous Flight & Skill Evolution) -->
  <g class="anim-wings">
    <!-- Left Cybernetic Wing (OpenClaw Fast Reflex Cyan) -->
    <g filter="url(#neonGlow)">
      <!-- Top Primary Feather Blade -->
      <path d="M 190,235 L 42,132 L 78,188 L 178,252 Z" fill="url(#hermesWingLeft)"/>
      <!-- Middle Feather Blade -->
      <path d="M 182,258 L 28,200 L 66,246 L 176,276 Z" fill="url(#hermesWingLeft)" opacity="0.9"/>
      <!-- Lower Feather Blade -->
      <path d="M 184,282 L 48,268 L 88,302 L 182,300 Z" fill="url(#hermesWingLeft)" opacity="0.78"/>
      <!-- Inner Wing Telemetry Rib -->
      <path d="M 188,242 L 60,152 M 180,265 L 48,214" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75"/>
    </g>

    <!-- Right Cybernetic Wing (Hermes Self-Evolution Gold-Violet) -->
    <g filter="url(#neonGlow)">
      <!-- Top Primary Feather Blade -->
      <path d="M 322,235 L 470,132 L 434,188 L 334,252 Z" fill="url(#hermesWingRight)"/>
      <!-- Middle Feather Blade -->
      <path d="M 330,258 L 484,200 L 446,246 L 336,276 Z" fill="url(#hermesWingRight)" opacity="0.9"/>
      <!-- Lower Feather Blade -->
      <path d="M 328,282 L 464,268 L 424,302 L 330,300 Z" fill="url(#hermesWingRight)" opacity="0.78"/>
      <!-- Inner Wing Telemetry Rib -->
      <path d="M 324,242 L 452,152 M 332,265 L 464,214" stroke="#fef3c7" stroke-width="1.5" opacity="0.75"/>
    </g>
  </g>

  <!-- HERMES CADUCEUS DOUBLE-HELIX & ORBITAL RINGS (3-Tier Memory & Closed-Loop Synthesis) -->
  <g class="anim-orbit-cw">
    <ellipse cx="256" cy="264" rx="156" ry="58" fill="none" stroke="url(#slowPathGrad)" stroke-width="2.5" stroke-dasharray="16 10" transform="rotate(-28 256 264)" filter="url(#neonGlow)"/>
    <circle cx="394" cy="190" r="5" fill="#f59e0b" filter="url(#neonGlow)"/>
    <circle cx="118" cy="338" r="4" fill="#d946ef"/>
  </g>

  <g class="anim-orbit-ccw">
    <ellipse cx="256" cy="264" rx="156" ry="58" fill="none" stroke="url(#fastPathGrad)" stroke-width="2.5" stroke-dasharray="16 10" transform="rotate(28 256 264)" filter="url(#neonGlow)"/>
    <circle cx="118" cy="190" r="5" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="394" cy="338" r="4" fill="#10b981"/>
  </g>

  <!-- Caduceus Lower Helix Tail (Hermes Procedural DNA Spine) -->
  <g opacity="0.85" filter="url(#neonGlow)">
    <path d="M 256,348 C 220,375 292,405 256,435 C 232,452 256,470 256,476" fill="none" stroke="url(#fastPathGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 256,348 C 292,375 220,405 256,435 C 280,452 256,470 256,476" fill="none" stroke="url(#slowPathGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="256" y1="340" x2="256" y2="478" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="256" cy="435" r="4.5" fill="#10b981"/>
  </g>

  <!-- DUAL-BRAIN QUANTUM CORE (Left: OpenClaw Fast Reflex | Right: Hermes Deep Evolution) -->
  <g class="anim-core">
    <!-- Left Hemisphere: Fast Path & Canonical KV-Cache -->
    <path d="M 256,184 A 80,80 0 0,0 256,344 Z" fill="url(#fastPathGrad)" opacity="0.92" filter="url(#neonGlow)"/>
    <!-- Right Hemisphere: Slow Path & Speculative Evolution -->
    <path d="M 256,184 A 80,80 0 0,1 256,344 Z" fill="url(#slowPathGrad)" opacity="0.92" filter="url(#neonGlow)"/>

    <!-- Neural Circuit Lines Inside Core -->
    <path d="M 212,230 L 236,230 L 246,248 M 204,264 L 232,264 M 214,296 L 238,296 L 246,280" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 300,230 L 276,230 L 266,248 M 308,264 L 280,264 M 298,296 L 274,296 L 266,280" fill="none" stroke="#fef3c7" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- Central Singularity Nexus -->
    <circle cx="256" cy="264" r="30" fill="#ffffff" filter="url(#neonGlow)"/>
    <polygon points="256,242 275,253 275,275 256,286 237,275 237,253" fill="#0b101e" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="256" cy="264" r="9" fill="#00f2fe"/>
    <line x1="256" y1="180" x2="256" y2="348" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- OPENCLAW IDENTITY: 4-Point Titanium Cybernetic Talon Gripping the Core -->
  <g>
    <!-- Crown Knuckle / Caduceus Apex -->
    <polygon points="256,42 276,68 256,92 236,68" fill="url(#slowPathGrad)" filter="url(#neonGlow)"/>
    <circle cx="256" cy="68" r="5" fill="#ffffff"/>

    <!-- Center Upper Primary Talon (Crown Mandible) -->
    <path d="M 226,74 L 256,108 L 286,74 L 276,136 L 256,198 L 236,136 Z" fill="url(#metalDark)" stroke="#64748b" stroke-width="1.8"/>
    <path d="M 256,108 L 286,74 L 276,136 L 256,198 Z" fill="url(#metalFacet)"/>
    <polygon points="256,198 261,218 256,226 251,218" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="256" cy="122" r="5" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>

    <!-- Left Outer Talon Claw (OpenClaw Fast Grip) -->
    <g transform="rotate(-44 256 264)">
      <path d="M 230,86 L 256,124 L 282,92 L 272,152 L 256,206 L 240,152 Z" fill="url(#metalDark)" stroke="#00f2fe" stroke-width="2"/>
      <path d="M 256,124 L 282,92 L 272,152 L 256,206 Z" fill="url(#metalFacet)"/>
      <circle cx="256" cy="132" r="6" fill="#090d16" stroke="#00f2fe" stroke-width="2.2"/>
      <path d="M 256,206 Q 246,236 226,248 Q 243,226 256,206 Z" fill="#00f2fe" filter="url(#neonGlow)"/>
    </g>

    <!-- Right Outer Talon Claw (Hermes Slow Grip) -->
    <g transform="rotate(44 256 264)">
      <path d="M 230,86 L 256,124 L 282,92 L 272,152 L 256,206 L 240,152 Z" fill="url(#metalDark)" stroke="#d946ef" stroke-width="2"/>
      <path d="M 256,124 L 282,92 L 272,152 L 256,206 Z" fill="url(#metalFacet)"/>
      <circle cx="256" cy="132" r="6" fill="#090d16" stroke="#f59e0b" stroke-width="2.2"/>
      <path d="M 256,206 Q 266,236 286,248 Q 269,226 256,206 Z" fill="#f59e0b" filter="url(#neonGlow)"/>
    </g>

    <!-- Lower Left Locking Claw -->
    <g transform="rotate(-132 256 264)">
      <path d="M 238,108 L 256,138 L 274,112 L 266,160 L 256,202 L 246,160 Z" fill="url(#metalDark)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256,202 Q 248,224 236,232 Q 249,218 256,202 Z" fill="#00f2fe"/>
    </g>

    <!-- Lower Right Locking Claw -->
    <g transform="rotate(132 256 264)">
      <path d="M 238,108 L 256,138 L 274,112 L 266,160 L 256,202 L 246,160 Z" fill="url(#metalDark)" stroke="#e879f9" stroke-width="1.5"/>
      <path d="M 256,202 Q 264,224 276,232 Q 263,218 256,202 Z" fill="#d946ef"/>
    </g>
  </g>

  <!-- Corner HUD Telemetry Brackets -->
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 42,86 L 42,58 L 70,58"/>
    <path d="M 470,86 L 470,58 L 442,58"/>
    <path d="M 42,426 L 42,454 L 70,454"/>
    <path d="M 470,426 L 470,454 L 442,454"/>
  </g>
</svg>
