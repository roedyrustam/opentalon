<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoFastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <linearGradient id="logoSlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="metalFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes spinOrbit1 {
        0% { transform: rotate3d(1, 0.4, 0.2, 0deg); }
        100% { transform: rotate3d(1, 0.4, 0.2, 360deg); }
      }
      @keyframes spinOrbit2 {
        0% { transform: rotate3d(0.3, 1, 0.5, 360deg); }
        100% { transform: rotate3d(0.3, 1, 0.5, 0deg); }
      }
      @keyframes pulseSphere {
        0%, 100% { transform: scale(0.96); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.8)); }
      }
      .anim-orbit-1 { transform-origin: 140px 140px; animation: spinOrbit1 12s linear infinite; }
      .anim-orbit-2 { transform-origin: 140px 140px; animation: spinOrbit2 16s linear infinite; }
      .anim-core-sphere { transform-origin: 140px 140px; animation: pulseSphere 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Left Icon Emblem (Scale & Center at 140, 140) -->
  <g transform="translate(0, 0)">
    <!-- Orbit 1 (Slow Path Violet) -->
    <g class="anim-orbit-1">
      <ellipse cx="140" cy="140" rx="90" ry="36" fill="none" stroke="url(#logoSlowGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.75" filter="url(#logoGlow)"/>
      <circle cx="230" cy="140" r="3" fill="#d946ef" filter="url(#logoGlow)"/>
    </g>

    <!-- Orbit 2 (Fast Path Cyan) -->
    <g class="anim-orbit-2">
      <ellipse cx="140" cy="140" rx="84" ry="30" fill="none" stroke="url(#logoFastGrad)" stroke-width="2" stroke-dasharray="12 6" opacity="0.85" filter="url(#logoGlow)"/>
      <circle cx="140" cy="110" r="3.5" fill="#00f2fe" filter="url(#logoGlow)"/>
    </g>

    <!-- Energy Core -->
    <g class="anim-core-sphere">
      <path d="M 140,94 A 46,46 0 0,0 140,186 Z" fill="url(#logoFastGrad)" opacity="0.85" filter="url(#logoGlow)"/>
      <path d="M 140,94 A 46,46 0 0,1 140,186 Z" fill="url(#logoSlowGrad)" opacity="0.85" filter="url(#logoGlow)"/>
      <circle cx="140" cy="140" r="20" fill="#ffffff" opacity="0.95" filter="url(#logoGlow)"/>
      <circle cx="140" cy="140" r="10" fill="#e0f2fe"/>
    </g>

    <!-- Claws Gripping -->
    <!-- Top Mandible -->
    <path d="M 124,28 L 140,49 L 156,28 L 151,58 L 140,91 L 129,58 Z" fill="url(#metalDark)" stroke="#475569" stroke-width="1.2"/>
    <path d="M 140,49 L 156,28 L 151,58 L 140,91 Z" fill="url(#metalFacet)"/>
    <polygon points="140,91 141,100 139,100" fill="#00f2fe" filter="url(#logoGlow)"/>

    <!-- Left Claw -->
    <g transform="rotate(-38 140 140)">
      <path d="M 127,40 L 140,61 L 153,43 L 147,73 L 140,101 L 133,73 Z" fill="url(#metalDark)" stroke="#38bdf8" stroke-width="1.2"/>
      <path d="M 140,61 L 153,43 L 147,73 L 140,101 Z" fill="url(#metalFacet)"/>
      <path d="M 140,101 Q 135,118 124,124 Q 133,113 140,101 Z" fill="#00f2fe" filter="url(#logoGlow)"/>
    </g>

    <!-- Right Claw -->
    <g transform="rotate(38 140 140)">
      <path d="M 127,40 L 140,61 L 153,43 L 147,73 L 140,101 L 133,73 Z" fill="url(#metalDark)" stroke="#c084fc" stroke-width="1.2"/>
      <path d="M 140,61 L 153,43 L 147,73 L 140,101 Z" fill="url(#metalFacet)"/>
      <path d="M 140,101 Q 145,118 156,124 Q 147,113 140,101 Z" fill="#d946ef" filter="url(#logoGlow)"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(280, 0)">
    <!-- Primary Wordmark -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-0.04em" fill="url(#textGrad)">
      OPEN<tspan fill="#00f2fe">TALON</tspan>
    </text>

    <!-- Subtitle / Architecture Badging -->
    <text x="4" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="600" font-size="16" letter-spacing="0.25em" fill="#64748b">
      DUAL-BRAIN AUTONOMOUS AGENT
    </text>

    <!-- Decorative Accent Line -->
    <line x1="4" y1="205" x2="380" y2="205" stroke="url(#logoFastGrad)" stroke-width="2.5" opacity="0.8"/>
    <circle cx="380" cy="205" r="3" fill="#d946ef" filter="url(#logoGlow)"/>

    <!-- Micro Tech Pills -->
    <rect x="4" y="222" width="105" height="24" rx="6" fill="#111827" stroke="#1f293d"/>
    <text x="14" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#00f2fe" font-weight="700">⚡ FAST &lt;1.5K</text>

    <rect x="119" y="222" width="118" height="24" rx="6" fill="#111827" stroke="#1f293d"/>
    <text x="129" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#d946ef" font-weight="700">🧠 SLOW CLOSED</text>

    <rect x="247" y="222" width="108" height="24" rx="6" fill="#111827" stroke="#1f293d"/>
    <text x="257" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#10b981" font-weight="700">🛡️ ZERO-TRUST</text>
  </g>
</svg>
